<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Closed</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0C0E1F;color:#9C9FCA;font:16px system-ui,sans-serif;text-align:center;padding:24px}b{color:#ECEAFF;display:block;font-size:20px;margin-bottom:6px}</style></head>
<body><div><b>This page is closed.</b>Nothing to see here.</div>
<script>/* remove the old offline copy so the installed app stops loading */
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{});
try{localStorage.clear();}catch(e){}</script></body></html>
