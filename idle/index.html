<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E1F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Belt Idle"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Asteroid Belt Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;
  --ink:#0C0E1F;--deep:#131631;--panel:#1A1E3F;--panel2:#232852;--line:#323A6E;
  --text:#ECEAFF;--muted:#9C9FCA;--ore:#F2B84B;--ore2:#FFD98A;--ice:#7FE3F0;--star:#C9A7FF;--ok:#5FD39A;
  --disp:"Chakra Petch",ui-rounded,"Segoe UI",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 90px;display:grid;gap:12px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:6px 8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.world{font:600 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ice);grid-column:1/-1}
.cash{font:700 clamp(30px,8vw,46px)/1 var(--disp);color:var(--ore2);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cash small{font:600 14px var(--body);color:var(--muted);margin-left:6px;letter-spacing:0}
.ps{font:600 15px var(--disp);color:var(--text);font-variant-numeric:tabular-nums}
.starchip{justify-self:end;text-align:right;font:600 13px var(--disp);color:var(--star)}
.starchip b{font-size:22px;display:block;line-height:1}
.sub{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:600 12px var(--body);padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.pill.ready{color:var(--ink);background:var(--star);border-color:var(--star)}
#boost{color:var(--ink);background:var(--ore);border-color:var(--ore)}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--deep);box-shadow:0 -12px 0 var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hudH,112px));z-index:4;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:max-content;padding:9px 12px;border-radius:9px;background:transparent;color:var(--muted);font:600 14px var(--disp);letter-spacing:.04em}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
/* buy amount */
.modes{display:flex;gap:6px;align-items:center;justify-content:flex-end;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hudH,112px) + var(--tabH,46px));z-index:3;background:var(--ink);padding-block:8px 6px;box-shadow:0 8px 10px -6px var(--ink)}
.modes span{font:600 12px var(--body);color:var(--muted);margin-right:auto}
.modes button{padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:600 13px var(--disp)}
.modes button[aria-pressed="true"]{background:var(--ore);color:var(--ink);border-color:var(--ore)}
/* groups */
#groups,#groups2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.grp{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 8px;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.grp b{font:600 13px var(--disp);color:var(--ice)}.grp span{color:var(--muted)}.grp em{font-style:normal;color:var(--text);font-weight:700}
.grp .gp{grid-column:1/3;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;align-self:center}.grp .gp i{display:block;height:100%;background:var(--ice)}
.grp .gc{grid-row:2;grid-column:3;font:600 12px var(--disp);color:var(--text)}
.grp.done{opacity:.6}
/* sound toggles, timed boosts */
.world{display:flex;align-items:center;gap:8px}.world #wname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snds{display:flex;gap:4px;flex:none}.snd{cursor:pointer;font:600 11px var(--disp);letter-spacing:.04em;text-transform:none;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.snd[aria-pressed="true"]{color:var(--ink);background:var(--ice);border-color:var(--ice)}
.timed{display:contents}.tchip{color:var(--ink);background:var(--ore2);border-color:var(--ore2);font-weight:700;font-size:11px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}.tchip em{font-style:normal;font-size:10px;background:var(--ink);color:var(--ore2);border-radius:6px;padding:0 4px;margin-left:4px}.evpill.hot{color:var(--ink);background:var(--ok);border-color:var(--ok)}.colpill{color:var(--ink);background:var(--ok);border-color:var(--ok);font-weight:700}
.tchip i{font-style:normal;display:inline-block;min-width:5ch;text-align:right;margin-left:4px;font-weight:600}#codeBox{width:100%;font:12px ui-monospace,monospace;background:var(--deep);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;margin:8px 0}.timedc{border-color:var(--ore)}
/* restart advice, events */
.pill.lv0{color:var(--muted)}.pill.lv1{color:var(--star);border-color:#4B3F86}.pill.lv2{color:var(--ink);background:var(--star);border-color:var(--star)}
.evpill{cursor:pointer;color:var(--ink);background:var(--ore);border-color:var(--ore);font-weight:700}
.advice{display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:10px 12px}
.advice b{font:700 16px var(--disp)}.advice span{color:var(--muted);font-size:13px}
.advice.lv1{border-left-color:var(--star)}.advice.lv2{border-left-color:var(--ok)}.advice.lv2 b{color:var(--ok)}
.grp.chal b{color:var(--ore)}.grp.chal .gp i{background:var(--ore)}
#chal{display:grid;gap:6px}
.ghost.small{padding:7px 12px;font-size:13px;justify-self:start;margin-top:6px}
.evb{display:flex;flex-wrap:wrap;gap:6px}.evb span{font:600 12px var(--body);padding:3px 9px;border-radius:8px;background:var(--panel);border:1px solid #4B3F86;color:var(--star)}
body[data-world="coffee"]{--ore:#E9A86A;--ore2:#FFD2A6;--ice:#9EE0B8}
body[data-world="salvage"]{--ore:#5FD3C8;--ore2:#A6F0E6;--ice:#7FB8F0;--ink:#081424;--deep:#0D1C33;--panel:#11243F;--panel2:#18304F;--line:#24456E}
.modes{flex-wrap:wrap}.quick{display:flex;gap:6px;flex-basis:100%;margin-top:2px}.quick button{flex:1;min-width:0;padding:6px 4px;border-radius:9px;background:var(--panel2);border:1px solid var(--ok);color:var(--text);font:600 12px var(--disp);white-space:nowrap}.quick button:disabled{opacity:.4;border-color:var(--line)}
.troph{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}.troph .big{font:700 26px var(--disp);color:var(--ore2);display:block}.meds{display:flex;flex-direction:column;gap:2px;font:600 12px var(--body);text-align:right}
.rcard small{display:block}.medal{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.track{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.trk{position:relative;height:12px;border-radius:7px;background:var(--deep)}.trk i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:linear-gradient(90deg,var(--ore),var(--ore2))}
.trk .mk{position:absolute;top:-3px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--deep);border:2px solid var(--mc)}.trk .mk.on{background:var(--mc)}.trl{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:600 13px var(--body);flex-wrap:wrap}.trl span{color:var(--muted)}
.grp.chal.done{border-color:var(--ok)}.grp.chal.done b{color:var(--ok)}.grp.chal .collectb{grid-column:1/-1;justify-self:end;padding:6px 14px}.grp.chal.got{opacity:.55}.grp.chal.got b{color:var(--muted)}
.grp.chal .skipb{grid-column:1/-1;justify-self:end;padding:4px 10px}
.curpill{color:var(--ink);background:var(--ice);border-color:var(--ice);font-variant-numeric:tabular-nums}.row.hot{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
body[data-world="event"]{--ice:#FFB36B}
body[data-world="tower"]{--ore:#C79AF0;--ore2:#E9D8FF;--ice:#8FD8F0;--ink:#120A24;--deep:#1C1236;--panel:#241848;--panel2:#2E205A;--line:#47357F}
body[data-world="candy"]{--ore:#FF8AC0;--ore2:#FFD0E8;--ice:#9AD8FF;--ink:#24101E;--deep:#33182C;--panel:#40203A;--panel2:#4E2848;--line:#73406A}
body[data-world="foundry"]{--ore:#FFA347;--ore2:#FFD2A0;--ice:#7FE3F0;--ink:#10141A;--deep:#181E26;--panel:#202833;--panel2:#2A3441;--line:#3F4D5E}
body[data-world="dino"]{--ore:#8FD06A;--ore2:#CDEFB0;--ice:#F2C46A;--ink:#0E1A10;--deep:#152618;--panel:#1C3220;--panel2:#243F29;--line:#3A6040}
.mechpill{font-variant-numeric:tabular-nums;color:var(--ore2);border-color:var(--ore)}.mechpill.hot{background:#5A2410;border-color:#FF7A3A;color:#FFD2A0}
/* tab badges, group tags, members, perk warnings */
.tabs button{position:relative}
.badge{position:absolute;top:3px;right:5px;min-width:9px;height:9px;border-radius:9px;background:var(--ore);font:700 9px/9px var(--disp);color:var(--ink);font-style:normal;padding:0 2px}
.badge:not(:empty){min-width:15px;height:15px;line-height:15px;top:1px;right:2px}
.gtag{font:600 9.5px var(--disp);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:6px;flex:none;align-self:center}
.nm .rate{margin-left:auto}
.pick{background:var(--panel);border:1px solid #4B3F86;border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.pickh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.pickh b{font:600 14px var(--disp);color:var(--star)}.pickh small{color:var(--muted);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{padding:10px;border-radius:10px;background:var(--deep);border:1px solid var(--line);font:600 14px var(--disp);text-align:left}.opt:hover,.opt:focus-visible{border-color:var(--star)}
.gtag.g0{color:#9AE6C8;background:rgba(95,211,154,.14)}.gtag.g1{color:var(--ice);background:rgba(127,227,240,.13)}.gtag.g2{color:var(--star);background:rgba(201,167,255,.15)}
.mem{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mem span{font:600 11px var(--body);padding:1px 6px;border-radius:6px;background:var(--panel2)}
.mem span.ok{color:var(--muted);opacity:.7}.mem span.need{color:var(--ink);background:var(--ore)}
.card small.warn{color:var(--ore)}
.buy.risky{background:#6B3A2A;color:#FFD9C7}
/* earner rows */
#earners{display:grid;gap:8px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.row.locked{opacity:.45;filter:saturate(.3)}
.row.banned{opacity:.45;filter:saturate(.2)}.row.banned .bar{visibility:hidden}
.row.locked .acts,.row.locked .bar,.row.locked .ms{visibility:hidden}
.rock{position:relative;width:62px;height:62px;border-radius:12px;background:var(--deep);display:grid;place-items:center;padding:6px}
.rock svg{width:44px;height:44px;image-rendering:pixelated}#gold svg{filter:drop-shadow(0 0 6px rgba(255,211,122,.9))}
.row.idle .rock{box-shadow:0 0 0 2px var(--ore);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(242,184,75,.35)}}
.own{position:absolute;right:-4px;bottom:-4px;min-width:26px;padding:1px 6px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font:700 12px var(--disp);font-variant-numeric:tabular-nums}
.mid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.nm{min-width:0;overflow:hidden}.nm span:first-child{min-width:0;flex:0 1 auto}.gtag{flex:none}.rate{flex:none}
.bar span{overflow:hidden;text-overflow:ellipsis;padding-inline:4px}.ms span{white-space:nowrap}
.nm{display:flex;justify-content:flex-start;align-items:baseline;gap:6px;font:600 15px var(--disp);letter-spacing:.02em}
.nm span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{color:var(--muted);font:600 12px var(--disp);white-space:nowrap}
.bar{position:relative;height:24px;background:var(--deep);border-radius:7px;overflow:hidden;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#C88A2A,var(--ore));width:0}
.row.auto .bar i{background:linear-gradient(90deg,#3A9FB0,var(--ice))}
.bar span{position:relative;display:block;text-align:center;font:600 12px/24px var(--disp);color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.ms{position:relative;height:14px;background:transparent;font:600 10.5px/14px var(--body);color:var(--muted);overflow:hidden;border-radius:4px}
.ms i{position:absolute;inset:0 auto 0 0;background:rgba(201,167,255,.18)}.ms span{position:relative;padding-left:4px}
.acts{display:grid;gap:5px;width:104px}
.buy,.mgr{display:grid;justify-items:center;padding:5px 6px;border-radius:9px;background:var(--ore);color:var(--ink);font:700 14px var(--disp);font-variant-numeric:tabular-nums;line-height:1.15}
.buy small,.mgr small{font:600 10.5px var(--body);opacity:.8}
.buy:disabled{background:var(--panel2);color:var(--muted)}
.mgr{background:var(--deep);color:var(--ice);border:1px solid #2E6E7A;font-size:13px}
.mgr:disabled{opacity:.5}.mgr.on{opacity:1;background:transparent;border-color:transparent;color:var(--ice);font:600 12px var(--disp)}
/* panes */
.pane{display:grid;gap:8px;align-content:start}
.lead{margin:0;color:var(--muted);max-width:62ch}
.pane h3{margin:10px 0 0;font:600 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ice)}
.card.good{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}.goodtag{display:table;font:700 10px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--ok);border-radius:6px;padding:1px 6px;margin-bottom:3px}
.card.good .buy:not(:disabled){background:var(--ok);border-color:var(--ok);color:var(--ink)}.card.good .buy:not(:disabled) small{color:var(--ink);opacity:.8}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card b{font:600 15px var(--disp)}.card small{display:block;color:var(--muted);font-size:12px}
.card .buy{width:104px}
.pupc{border-color:#4B3F86}
.muted{color:var(--muted);margin:0}.small{font-size:12px}.ok{color:var(--ok)}.maxed{font:600 12px var(--disp);color:var(--muted)}
.starbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.starbox>div{background:var(--panel);border:1px solid #4B3F86;border-radius:12px;padding:12px}
.starbox .big{font:700 34px/1 var(--disp);color:var(--star)}.starbox small{display:block;color:var(--muted)}
.go{padding:12px 16px;border-radius:11px;background:var(--star);color:var(--ink);font:700 16px var(--disp)}
.go:disabled{background:var(--panel2);color:var(--muted)}.go.wide{width:100%}
.ghost{padding:12px 16px;border-radius:11px;background:transparent;border:1px solid var(--line);font:600 15px var(--disp)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.wcard b{font:700 17px var(--disp)}.wcard small{color:var(--muted)}.wcard.on{border-color:var(--ice)}.wcard .tag{font:600 11px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
.wcard.lock{opacity:.6}
/* golden asteroid */
#gold{position:fixed;left:0;z-index:8;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.35),rgba(242,184,75,.15) 60%,transparent 72%);box-shadow:0 0 26px rgba(255,211,122,.75);display:grid;place-items:center;font:700 11px var(--disp);color:var(--ink)}
#gold.fly{animation:fly 11s linear forwards}
@keyframes fly{from{transform:translateX(calc(100vw + 20px)) rotate(0)}to{transform:translateX(-90px) rotate(-540deg)}}
@media (prefers-reduced-motion:reduce){#gold.fly{animation:none;left:auto;right:20px}.row.idle .rock{animation:none}}
/* toasts + modal */
#toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:grid;gap:6px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--deep);border:1px solid var(--line);border-left:4px solid var(--ice);border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .5s,transform .5s}
.toast b{font-family:var(--disp);margin-right:4px}.toast small{display:block;color:var(--muted)}
.toast.pup{border-left-color:var(--star)}.toast.gold{border-left-color:var(--ore)}.toast.star{border-left-color:var(--star)}
.toast.out{opacity:0;transform:translateY(8px)}
#modal{position:fixed;inset:0;z-index:10;background:rgba(6,7,18,.72);display:grid;place-items:center;padding:16px}
#modalCard{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,100%);display:grid;gap:10px}
#modalCard h2{margin:0;font:700 22px var(--disp)}#modalCard p{margin:0;color:var(--muted)}#modalCard p b{color:var(--text)}
.bigstat{background:var(--panel);border-radius:12px;padding:12px;text-align:center}.bigstat span{font:700 34px var(--disp);color:var(--ore2)}.bigstat small{display:block;color:var(--muted)}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:900px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .side{position:sticky;top:176px;display:grid;gap:8px}
  #groups{grid-template-columns:1fr}
}
@media (max-width:520px){.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.tabs button{min-width:0;padding:8px 2px;font-size:12.5px;letter-spacing:0}.modes span{display:none}}
@media (max-width:420px){.row{grid-template-columns:52px minmax(0,1fr) 92px;gap:8px;padding:7px}.rock{width:52px;height:52px}.rock svg{width:38px;height:38px}.acts{width:92px}.nm{font-size:14px}.rate{display:none}}

/* ---- world actions ---- */
.act{background:var(--panel);border:1px solid var(--ore);border-radius:12px;padding:9px 11px;margin-bottom:8px;display:grid;gap:7px}
.acth b{font:600 14px var(--disp);color:var(--ore2);margin-right:6px}.acth small{color:var(--muted);font-size:12.5px}.acth small b{color:var(--text);font-size:12.5px;font-family:var(--body);margin:0}
.actrow{display:flex;gap:6px;align-items:center}.actrow>*{min-width:0}

.spell b{font:600 13px var(--disp)}.spell small{font-size:11px;color:var(--muted);line-height:1.2}.spell.cd{opacity:.55;border-color:var(--line)}.spell.bp small{color:var(--text);font-size:11.5px}.spell.rk{border-color:#FF7A6B}

<script>
/* ===================== ECONOMY (pure: shared by the game and the pacing simulator) ===================== */
/* Main worlds stack power-ups by ADDING (steady growth). Events stack by MULTIPLYING (wild, short-lived growth). */
const ECON_MAKE=function(W){
const ADD=W.stack!=='mult';
W.starPer=W.starPer||0.02;W.msStep=W.msStep||100;W.msBeyond=W.msBeyond||1.5;
/* ---- random numbers with a saved seed, so a run's surprises survive a reload ---- */
function rng(st){st.seed=(st.seed*1664525+1013904223)>>>0;return st.seed/4294967296;}
const pct=m=>Math.round(m*100)+'%';
/* ---- power-ups drawn when a group target is reached ---- */
const PUPS=[
 {k:'all',     w:20, txt:m=>ADD?`Everything +${pct(m)}`:`Everything ×${m}`},
 {k:'tier',    w:18, txt:(m,t)=>ADD?`${W.tiers[t].name} +${pct(m)}`:`${W.tiers[t].name} ×${m}`},
 {k:'speed',   w:18, txt:(m,t)=>ADD?`${W.tiers[t].name} works ${pct(m)} faster`:`${W.tiers[t].name} works ×${m} faster`},
 {k:'grpspeed',w:8,  txt:(m,t)=>ADD?`${W.bands[t].name} items work ${pct(m)} faster`:`${W.bands[t].name} items work ×${m} faster`},
 {k:'allspeed',w:6,  txt:m=>ADD?`Everything works ${pct(m)} faster`:`Everything works ×${m} faster`},
 {k:'cost',    w:8,  txt:m=>`Everything costs ${Math.round((1-m)*100)}% less`},
 {k:'mgr',     w:6,  txt:m=>ADD?`Managed items +${pct(m)}`:`Managed items ×${m}`},
 {k:'tx',      w:6,  txt:(m,t,d)=>`Everything ×${m} for ${d/60000} minutes`},
 {k:'ttier',   w:5,  txt:(m,t,d)=>`${W.tiers[t].name} ×${m} for ${d/60000} minutes`},
 {k:'tfast',   w:5,  txt:(m,t,d)=>`Everything ×${m} speed for ${d/60000} minutes`}];
const TIMED={tx:1,ttier:1,tfast:1};
function drawPup(st,big){let r=rng(st)*100,p=PUPS[0];for(const q of PUPS){if(r<q.w){p=q;break;}r-=q.w;}
  const owned=st.tiers.map((x,i)=>x.n>0&&allowed(st,i)?i:-1).filter(i=>i>=0);const t=owned.length?owned[Math.floor(rng(st)*owned.length)]:0;
  let m,d=0,tt=t;const pick=a=>a[Math.floor(rng(st)*a.length)];
  if(ADD)switch(p.k){           // amounts are ADDED together (+50% means ×1.5 on its own, +100% from two)
    case 'all':m=big?1:pick([0.5,0.5,0.75]);break;
    case 'tier':m=W.swing?(big?pick([3,4,6]):pick([1,2,3])):(big?4:pick([2,2,3]));break;
    case 'speed':m=(t>=8?[1,2]:t>=4?[0.75,1]:[0.5,0.75])[big?1:0];break;
    case 'grpspeed':tt=rng(st)<.5?2:(rng(st)<.6?1:0);m=[[0.5,0.75],[0.75,1],[1,1.5]][tt][big?1:0];break;
    case 'allspeed':m=big?0.5:0.25;break;
    case 'cost':m=big?0.8:0.9;break;
    case 'mgr':m=big?1:0.5;break;
    case 'tx':m=big?5:3;d=(big?15:10)*60000;break;
    case 'ttier':m=big?25:10;d=15*60000;break;
    case 'tfast':m=2;d=(big?10:5)*60000;break;}
  else switch(p.k){             // events: everything multiplies
    case 'all':m=big?2:(rng(st)<.25?1.75:1.5);break;
    case 'tier':m=big?5:(rng(st)<.3?4:3);break;
    case 'speed':m=(t>=8?[3,5]:t>=4?[2,3]:[1.5,2])[big?1:0];break;
    case 'grpspeed':tt=rng(st)<.5?2:(rng(st)<.6?1:0);m=[[1.5,2],[2,3],[2.5,4]][tt][big?1:0];break;
    case 'allspeed':m=big?1.5:1.25;break;
    case 'cost':m=big?0.8:0.9;break;
    case 'mgr':m=big?2:(rng(st)<.5?1.5:1.25);break;
    case 'tx':m=big?25:10;d=(big?15:10)*60000;break;
    case 'ttier':m=big?100:25;d=15*60000;break;
    case 'tfast':m=3;d=(big?10:5)*60000;break;}
  return {k:p.k,t:tt,m,d,txt:p.txt(m,tt,d)};}
function jitter(st,arr,a=0.8,b=1.1){return arr.map(v=>v<=1?v:Math.max(1,Math.round(v*(a+rng(st)*(b-a)))));}
/* ---- a fresh run ---- */
function newRun(st){st.pHist=[];
  st.cash=HEAD[st.perks.head||0]||0;st.runEarned=0;st.runStart=st.now||0;
  st.tiers=W.tiers.map((_,i)=>({n:i===0?1:0,mgr:i<(st.perks.keepMgr||0),prog:0,run:false}));
  st.ups={};st.pups=[];st.picks=[];st.timed=[];st.pupCount=0;st.bandIdx=[0,0,0];st.fullIdx=0;
  const bs=(st.mod&&st.mod.band)||1;st.bandT=W.bands.map(()=>jitter(st,W.bandTargets.map(v=>Math.max(1,Math.round(v*bs)))));st.fullT=jitter(st,W.fullTargets,0.85,1.15);
  rollMilestones(st);st.boost=null;st.nextGold=(st.now||0)+ (40+rng(st)*60)*1000;
  if(st.perks.startPup)for(let i=0;i<st.perks.startPup;i++)st.pups.push(drawPup(st,false));
  return st;}
function fresh(now){const st={v:1,seed:(Math.random()*4294967296)>>>0,now,stars:0,starsEver:0,total:0,runs:0,perks:{},best:0,playMs:0,sv:2,life:0,pupEver:0};return newRun(st);}
/* ---- upgrades (one-off, per run): item ×3 every 150× the price, everything ×2 (events ×3) every 10,000× ---- */
const UPS=[];
const UPM=W.upM||3,UPG=W.upGap||150;
/* upgrades come in different kinds (profit, speed, price cuts, free items, managers), mixed the same way each run for a world */
const hseed=[...W.id].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0;const hf=(a,b)=>{let h=(hseed^(a*374761393+b*668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return ((h^(h>>>16))>>>0)/4294967296;};
W.tiers.forEach((T,i)=>{for(let k=0;k<16;k++){const r=hf(i,k),cost=T.cost*400*Math.pow(UPG,k);let u;
  if(r<.45)u={kind:'pr',m:UPM,txt:`${T.name} ×${UPM}`};else if(r<.55)u={kind:'pr',m:UPM+1,txt:`${T.name} ×${UPM+1}`};
  else if(r<.75)u={kind:'sp',m:2,txt:`${T.name} works ×2 faster`};else if(r<.88)u={kind:'cost',m:0.7,txt:`${T.name} costs 30% less`};
  else{const m=10*(k+1)+(i<4?20:0);u={kind:'free',m,txt:`+${m} free ${T.name}`};}
  UPS.push(Object.assign({id:'a'+i+'_'+k,t:i,cost},u));}});
const GG=W.gGap||1e4;for(let k=0;k<20;k++){const r=hf(99,k),cost=1e6*Math.pow(GG,k);const m=ADD?2:3;let u;
  if(r<.55)u={kind:'all',m,txt:`Everything ×${m}`};else if(r<.75)u={kind:'allsp',m:1.5,txt:'Everything works ×1.5 faster'};
  else if(r<.9)u={kind:'allcost',m:0.75,txt:'Everything costs 25% less'};else u={kind:'mgr',m:2.5,txt:'Managed items ×2.5'};
  UPS.push(Object.assign({id:'g'+k,t:-1,cost},u));}
UPS.sort((a,b)=>a.cost-b.cost);
/* ---- milestones: each item has its own ladder, then a new milestone every +100 for good ---- */
const LADDERS={early:[25,75,150,250,400,550,700,850,1000,1200,1400,1600],mid:[25,50,100,175,275,400,550,700,850,1000,1200,1400],
  late:[10,25,40,60,100,150,200,275,350,450,550,700],top:[5,15,25,40,60,90,125,175,250,325,400,500]};
const LADDER_OF=['early','early','early','mid','mid','mid','mid','late','late','late','top','top'];
function ladder(i){return W.ladders?W.ladders[i]:LADDERS[LADDER_OF[i]];}
function rollMilestones(st){st.msR=W.tiers.map((_,i)=>ladder(i).map((ms,k)=>{
    if(W.pers){const r=rng(st),o=()=>{let t=i;while(t===i)t=Math.floor(rng(st)*W.tiers.length);return t;};   // wild events: every item has its own personality
      switch(W.pers[i]){
      case 'jackpot':return k%3===2?(r<.5?{k:'profit',m:W.tame?3:10}:{k:'all',m:W.tame?1.2:2}):{k:'profit',m:1.2};
      case 'helper':return r<.75?{k:'other',t:o(),m:W.tame?2:4}:{k:'speed',m:2};
      case 'surger':return k%2?{k:'surge',m:W.tame?5:10}:{k:'speed',m:2};
      case 'miser':return r<.6?{k:'cost',m:W.tame?0.85:0.6}:{k:'profit',m:2};
      default:return k%2?{k:'profit',m:2}:{k:'speed',m:2};}}
    if(k<2)return {k:'speed',m:2};const r=rng(st);
    if(!ADD){             // events: big swings, boosts to other items
      if(r<.34)return {k:'profit',m:rng(st)<.25?3:2};if(r<.54)return {k:'speed',m:2};
      if(r<.74){let t=i;while(t===i)t=Math.floor(rng(st)*W.tiers.length);return {k:'other',t,m:3};}
      if(r<.88)return {k:'cost',m:0.85};return {k:'all',m:1.25};}
    if(W.swing){          // Coffee: bigger, less predictable
      if(r<.45)return {k:'profit',m:[2,2,3,4][Math.floor(rng(st)*4)]};if(r<.6)return {k:'speed',m:2};
      if(r<.75){let t=i;while(t===i)t=Math.floor(rng(st)*W.tiers.length);return {k:'other',t,m:2};}
      if(r<.88)return {k:'cost',m:0.85};return {k:'all',m:1.15};}
    if(r<.6)return {k:'profit',m:2};if(r<.75)return {k:'speed',m:2};if(r<.9)return {k:'cost',m:0.85};return {k:'all',m:1.1};}));}
function lastRung(i){const L=ladder(i);return L[L.length-1];}
function nextMilestone(n,i){const L=ladder(i||0);const x=L.find(m=>m>n);if(x)return x;const b=lastRung(i||0);return b+W.msStep*(Math.floor((n-b)/W.msStep)+1);}
function msText(st,i,k){if(k>=ladder(i).length)return `profit ×${W.msBeyond}`;const r=st.msR[i][k];switch(r.k){case 'speed':return 'speed ×2';case 'profit':return `profit ×${r.m}`;
  case 'other':return `${W.tiers[r.t].name} ×${r.m}`;case 'cost':return `price −${Math.round((1-r.m)*100)}%`;case 'surge':return `surge ×${r.m} for 2 min`;case 'all':return `everything ×${r.m}`;}return '';}
function msInfo(st,i){const n=st.tiers[i].n,L=ladder(i);const next=nextMilestone(n,i);const k=L.indexOf(next);
  const prev=k>0?L[k-1]:k===0?0:next-W.msStep;return {prev,next,txt:msText(st,i,k<0?L.length:k)};}
function crossed(i,a,b){return nextMilestone(a,i)<=b;}
/* ---- all multipliers in one pass ---- */
function starMult(st){return 1+((st.mod&&st.mod.starPer)||W.starPer)*st.stars;}
/* Robot Foundry: machines run hot (×3 speed) for 4 minutes, then cool down (×0.5) for 1 minute */
function heatX(st){if(!W.heat&&!(st.mod&&st.mod.heat))return 1;return ((st.now||0)%300000)<240000?3:0.5;}
function heatLeft(st){const p=(st.now||0)%300000;return p<240000?{hot:true,left:240000-p}:{hot:false,left:300000-p};}
function currentBand(st){return W.current?Math.floor((st.now||0)/W.current)%3:-1;}
function costMult(st){let m=(st.mod&&st.mod.cost)||1;st.pups.forEach(p=>{if(p.k==='cost')m*=p.m;});UPS.forEach(u=>{if(u.kind==='allcost'&&st.ups[u.id])m*=u.m;});return Math.max(m,0.25);}
function fx(st){if(!st.msR)rollMilestones(st);const N=W.tiers.length;const pr=new Array(N).fill(1),sp=new Array(N).fill(1),cost=new Array(N).fill(1);let all=1;
  st.tiers.forEach((T,i)=>{const L=ladder(i);for(let k=0;k<L.length&&T.n>=L[k];k++){const r=st.msR[i][k];

      col[c]=rg[reg[r][c]]=true;pos[r]=c;go(r+1);col[c]=rg[reg[r][c]]=false;if(cnt>=limit)return;}}

function pix(str,size){return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"${size?` width="${size}" height="${size}"`:''}>`+str.split(' ').map(t=>{const [x,y,w,h,c]=t.split(',');return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}).join('')+'</svg>';}
function iconWorld(){return ICONS[P.cur]?P.cur:'belt';}
function goldIcon(){const k=GOLDI[P.cur]?P.cur:'belt';const g=$('#gold');g.innerHTML=pix(GOLDI[k],40);g.setAttribute('aria-label',(ECONS[k].W.goldName||'Golden asteroid').replace(/s$/,'')+': tap for a bonus');}
function rockSVG(i){return pix(ICONS[iconWorld()][i]);}
/* ---- build static rows once ---- */
function buildEarners(){$('#earners').innerHTML=W.tiers.map((T,i)=>`
 <div class="row" id="r${i}" data-i="${i}">
   <button class="rock" data-tap="${i}" aria-label="Collect from ${esc(T.name)}">${rockSVG(i)}<b class="own" id="own${i}">0</b></button>
   <div class="mid"><div class="nm"><span>${esc(T.name)}</span><span class="gtag g${Math.floor(i/4)}">${esc(W.bands[Math.floor(i/4)].name.split(' ')[0])}</span><span class="rate" id="rate${i}"></span></div>
     <div class="bar" data-tap="${i}"><i id="bar${i}"></i><span id="pay${i}"></span></div>
     <div class="ms" id="ms${i}"></div></div>
   <div class="acts"><button class="buy" data-buy="${i}" id="buy${i}"><small id="buyn${i}">Buy 1</small><b id="cost${i}"></b></button>
     <button class="mgr" data-mgr="${i}" id="mgr${i}"></button></div>
 </div>`).join('');}
function arcPill(){const b=$('#arcpill');if(!b||!P.arc)return;const d=!(P.arc.daily&&P.arc.daily.id===Math.round(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()).getTime()/864e5)&&P.arc.daily.done);
  const can=P.arc.built<18&&P.arc.cr>=3+(P.arc.built%6)+2*Math.floor(P.arc.built/6);const txt='♛ Arcade'+(can?' · build ready':d?' · daily puzzle':'');if(b.textContent!==txt)b.textContent=txt;b.classList.toggle('hot',can||!P.arc.seen);}
const UNLOCK={coffee:{need:500,from:'belt'},salvage:{need:500,from:'coffee'},tower:{need:500,from:'salvage'},candy:{need:500,from:'tower'},foundry:{need:500,from:'candy'},dino:{need:500,from:'foundry'}};
const WORLD_IDS=['belt','coffee','salvage','tower','candy','foundry','dino'];
function unlocked(id){const u=UNLOCK[id];if(!u)return true;const S=P.w[u.from];return !!S&&(S.starsEver||0)>=u.need;}
function unlockCoffee(){return unlocked('coffee');}
function checkUnlocks(){WORLD_IDS.slice(1).forEach(id=>{if(!P.unl[id]&&unlocked(id)){P.unl[id]=1;toast(`<b>${esc(ECONS[id].W.name)} unlocked</b> Find it on the Worlds tab.`,'star');AUDIO.play('challenge');}});
  if(!P.unl.event&&eventsOpen()){P.unl.event=1;toast('<b>Weekly events unlocked</b> Three each week: weekend (Friday), Sunday and midweek (Wednesday). Find them on the Worlds tab.','star');}}
const WNUM={belt:1,coffee:2,salvage:3,tower:4,candy:5,foundry:6,dino:7};
function audioBtns(){const m=$('#musBtn'),x=$('#sfxBtn');m.setAttribute('aria-label',P.audio.music?'Music is on. Turn it off':'Music is off. Turn it on');x.setAttribute('aria-label',P.audio.sfx?'Sounds are on. Turn them off':'Sounds are off. Turn them on');m.setAttribute('aria-pressed',String(P.audio.music));x.setAttribute('aria-pressed',String(P.audio.sfx));}
function switchWorld(id,quiet){if(UNLOCK[id]&&!P.w[id]){if(!unlocked(id))return;P.w[id]=ECONS[id].fresh(now());}
  if(id==='event'&&!P.ev)return;if(id==='bonus'&&!P.br)return;if(st)st.seen=now();P.cur=id;AUDIO.world(id==='bonus'?'event':id);E=econOf(id);W=E.W;st=stateOf(id);st.now=now();st.nextGold=Math.max(st.nextGold||0,now()+15000);
  $('#gold').hidden=true;goldIcon();const r=redeem(id);buildEarners();labels();if(!quiet){setTab('earners');if(r&&r.gap>30000)welcome(r);else toast(`<b>${esc(id==='event'?evName(P.ev):W.name)}</b> ${id==='event'?'Finish challenges for tokens.':esc(W.blurb)}`);}save();}
function labels(){const ev=P.cur==='event',br=P.cur==='bonus';const tw=ev?TWISTS.find(x=>x.id===P.ev.tw):null;
  $('#wname').textContent=br?`Bonus round · ${roundOf(P.br.id).name}`:ev?`${evName(P.ev)} · ${tw.name}`:`World ${WNUM[P.cur]} · ${W.name}`;$('#curlbl').textContent=W.cur;
  $('#starlbl').textContent=br?'Trophies':ev?'Tokens':W.starName;$('[data-tab="stars"] .tl').textContent=br?'Round':ev?'Event':W.starName;document.body.dataset.world=br?'event':P.cur;}
function setTab(t){tab=t;$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));$$('section.pane').forEach(p=>p.hidden=p.id!=='p-'+t);render(true);}
/* ---- toasts ---- */
function toast(html,cls=''){const box=$('#toasts');while(box.children.length>=2)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.innerHTML=html;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),3400);setTimeout(()=>d.remove(),4000);}
function announce(got){got.forEach(p=>toast(`<b>Power-up to choose</b> ${esc(p.src)}<small>Pick 1 of ${p.opts.length} on the Power-ups tab. One is picked for you after 3 minutes.</small>`,'pup'));}
/* ---- actions ---- */
function amount(i){if(mode==='max')return Math.max(1,E.maxAfford(st,i));if(mode==='next'){const nm=E.nextMilestone(st.tiers[i].n,i);return nm?nm-st.tiers[i].n:1;}return mode;}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-tap]');if(!b)return;
  if(b.dataset.tap!=null){E.tap(st,+b.dataset.tap);return;}
  if(b.dataset.buy!=null){const i=+b.dataset.buy;const before=(st.picks||[]).length;const n0=st.tiers[i].n;if(E.buy(st,i,amount(i))){const got=(st.picks||[]).slice(before);announce(got);
