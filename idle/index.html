<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E1F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Belt Idle"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Asteroid Belt Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;
  --ink:#0C0E1F;--deep:#131631;--panel:#1A1E3F;--panel2:#232852;--line:#323A6E;
  --text:#ECEAFF;--muted:#9C9FCA;--ore:#F2B84B;--ore2:#FFD98A;--ice:#7FE3F0;--star:#C9A7FF;--ok:#5FD39A;
  --disp:"Chakra Petch",ui-rounded,"Segoe UI",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 90px;display:grid;gap:12px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:6px 8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.world{font:600 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ice);grid-column:1/-1}
.cash{font:700 clamp(30px,8vw,46px)/1 var(--disp);color:var(--ore2);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cash small{font:600 14px var(--body);color:var(--muted);margin-left:6px;letter-spacing:0}
.ps{font:600 15px var(--disp);color:var(--text);font-variant-numeric:tabular-nums}
.starchip{justify-self:end;text-align:right;font:600 13px var(--disp);color:var(--star)}
.starchip b{font-size:22px;display:block;line-height:1}
.sub{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:600 12px var(--body);padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.pill.ready{color:var(--ink);background:var(--star);border-color:var(--star)}
#boost{color:var(--ink);background:var(--ore);border-color:var(--ore)}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--deep);box-shadow:0 -12px 0 var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hudH,112px));z-index:4;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:max-content;padding:9px 12px;border-radius:9px;background:transparent;color:var(--muted);font:600 14px var(--disp);letter-spacing:.04em}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
/* buy amount */
.modes{display:flex;gap:6px;align-items:center;justify-content:flex-end;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hudH,112px) + var(--tabH,46px));z-index:3;background:var(--ink);padding-block:8px 6px;box-shadow:0 8px 10px -6px var(--ink)}
.modes span{font:600 12px var(--body);color:var(--muted);margin-right:auto}
.modes button{padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:600 13px var(--disp)}
.modes button[aria-pressed="true"]{background:var(--ore);color:var(--ink);border-color:var(--ore)}
/* groups */
#groups,#groups2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.grp{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 8px;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.grp b{font:600 13px var(--disp);color:var(--ice)}.grp span{color:var(--muted)}.grp em{font-style:normal;color:var(--text);font-weight:700}
.grp .gp{grid-column:1/3;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;align-self:center}.grp .gp i{display:block;height:100%;background:var(--ice)}
.grp .gc{grid-row:2;grid-column:3;font:600 12px var(--disp);color:var(--text)}
.grp.done{opacity:.6}
/* sound toggles, timed boosts */
.world{display:flex;align-items:center;gap:8px}.world #wname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snds{display:flex;gap:4px;flex:none}.snd{cursor:pointer;font:600 11px var(--disp);letter-spacing:.04em;text-transform:none;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.snd[aria-pressed="true"]{color:var(--ink);background:var(--ice);border-color:var(--ice)}
.timed{display:contents}.tchip{color:var(--ink);background:var(--ore2);border-color:var(--ore2);font-weight:700;font-size:11px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}.tchip i{font-style:normal;display:inline-block;min-width:5ch;text-align:right;margin-left:4px;font-weight:600}#codeBox{width:100%;font:12px ui-monospace,monospace;background:var(--deep);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;margin:8px 0}.timedc{border-color:var(--ore)}
/* restart advice, events */
.pill.lv0{color:var(--muted)}.pill.lv1{color:var(--star);border-color:#4B3F86}.pill.lv2{color:var(--ink);background:var(--star);border-color:var(--star)}
.evpill{cursor:pointer;color:var(--ink);background:var(--ore);border-color:var(--ore);font-weight:700}
.advice{display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:10px 12px}
.advice b{font:700 16px var(--disp)}.advice span{color:var(--muted);font-size:13px}
.advice.lv1{border-left-color:var(--star)}.advice.lv2{border-left-color:var(--ok)}.advice.lv2 b{color:var(--ok)}
.grp.chal b{color:var(--ore)}.grp.chal .gp i{background:var(--ore)}
#chal{display:grid;gap:6px}
.ghost.small{padding:7px 12px;font-size:13px;justify-self:start;margin-top:6px}
.evb{display:flex;flex-wrap:wrap;gap:6px}.evb span{font:600 12px var(--body);padding:3px 9px;border-radius:8px;background:var(--panel);border:1px solid #4B3F86;color:var(--star)}
body[data-world="coffee"]{--ore:#E9A86A;--ore2:#FFD2A6;--ice:#9EE0B8}
body[data-world="salvage"]{--ore:#5FD3C8;--ore2:#A6F0E6;--ice:#7FB8F0;--ink:#081424;--deep:#0D1C33;--panel:#11243F;--panel2:#18304F;--line:#24456E}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.quick button{flex:1;min-width:140px}.quick button:disabled{opacity:.45}
.curpill{color:var(--ink);background:var(--ice);border-color:var(--ice);font-variant-numeric:tabular-nums}.row.hot{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
body[data-world="event"]{--ice:#FFB36B}
/* tab badges, group tags, members, perk warnings */
.tabs button{position:relative}
.badge{position:absolute;top:3px;right:5px;min-width:9px;height:9px;border-radius:9px;background:var(--ore);font:700 9px/9px var(--disp);color:var(--ink);font-style:normal;padding:0 2px}
.badge:not(:empty){min-width:15px;height:15px;line-height:15px;top:1px;right:2px}
.gtag{font:600 9.5px var(--disp);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:6px;flex:none;align-self:center}
.nm .rate{margin-left:auto}
.pick{background:var(--panel);border:1px solid #4B3F86;border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.pickh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.pickh b{font:600 14px var(--disp);color:var(--star)}.pickh small{color:var(--muted);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{padding:10px;border-radius:10px;background:var(--deep);border:1px solid var(--line);font:600 14px var(--disp);text-align:left}.opt:hover,.opt:focus-visible{border-color:var(--star)}
.gtag.g0{color:#9AE6C8;background:rgba(95,211,154,.14)}.gtag.g1{color:var(--ice);background:rgba(127,227,240,.13)}.gtag.g2{color:var(--star);background:rgba(201,167,255,.15)}
.mem{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mem span{font:600 11px var(--body);padding:1px 6px;border-radius:6px;background:var(--panel2)}
.mem span.ok{color:var(--muted);opacity:.7}.mem span.need{color:var(--ink);background:var(--ore)}
.card small.warn{color:var(--ore)}
.buy.risky{background:#6B3A2A;color:#FFD9C7}
/* earner rows */
#earners{display:grid;gap:8px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.row.locked{opacity:.45;filter:saturate(.3)}
.row.banned{opacity:.45;filter:saturate(.2)}.row.banned .bar{visibility:hidden}
.row.locked .acts,.row.locked .bar,.row.locked .ms{visibility:hidden}
.rock{position:relative;width:62px;height:62px;border-radius:12px;background:var(--deep);display:grid;place-items:center;padding:6px}
.rock svg{width:44px;height:44px;image-rendering:pixelated}
.row.idle .rock{box-shadow:0 0 0 2px var(--ore);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(242,184,75,.35)}}
.own{position:absolute;right:-4px;bottom:-4px;min-width:26px;padding:1px 6px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font:700 12px var(--disp);font-variant-numeric:tabular-nums}
.mid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.nm{min-width:0;overflow:hidden}.nm span:first-child{min-width:0;flex:0 1 auto}.gtag{flex:none}.rate{flex:none}
.bar span{overflow:hidden;text-overflow:ellipsis;padding-inline:4px}.ms span{white-space:nowrap}
.nm{display:flex;justify-content:flex-start;align-items:baseline;gap:6px;font:600 15px var(--disp);letter-spacing:.02em}
.nm span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{color:var(--muted);font:600 12px var(--disp);white-space:nowrap}
.bar{position:relative;height:24px;background:var(--deep);border-radius:7px;overflow:hidden;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#C88A2A,var(--ore));width:0}
.row.auto .bar i{background:linear-gradient(90deg,#3A9FB0,var(--ice))}
.bar span{position:relative;display:block;text-align:center;font:600 12px/24px var(--disp);color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.ms{position:relative;height:14px;background:transparent;font:600 10.5px/14px var(--body);color:var(--muted);overflow:hidden;border-radius:4px}
.ms i{position:absolute;inset:0 auto 0 0;background:rgba(201,167,255,.18)}.ms span{position:relative;padding-left:4px}
.acts{display:grid;gap:5px;width:104px}
.buy,.mgr{display:grid;justify-items:center;padding:5px 6px;border-radius:9px;background:var(--ore);color:var(--ink);font:700 14px var(--disp);font-variant-numeric:tabular-nums;line-height:1.15}
.buy small,.mgr small{font:600 10.5px var(--body);opacity:.8}
.buy:disabled{background:var(--panel2);color:var(--muted)}
.mgr{background:var(--deep);color:var(--ice);border:1px solid #2E6E7A;font-size:13px}
.mgr:disabled{opacity:.5}.mgr.on{opacity:1;background:transparent;border-color:transparent;color:var(--ice);font:600 12px var(--disp)}
/* panes */
.pane{display:grid;gap:8px;align-content:start}
.lead{margin:0;color:var(--muted);max-width:62ch}
.pane h3{margin:10px 0 0;font:600 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ice)}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card b{font:600 15px var(--disp)}.card small{display:block;color:var(--muted);font-size:12px}
.card .buy{width:104px}
.pupc{border-color:#4B3F86}
.muted{color:var(--muted);margin:0}.small{font-size:12px}.ok{color:var(--ok)}.maxed{font:600 12px var(--disp);color:var(--muted)}
.starbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.starbox>div{background:var(--panel);border:1px solid #4B3F86;border-radius:12px;padding:12px}
.starbox .big{font:700 34px/1 var(--disp);color:var(--star)}.starbox small{display:block;color:var(--muted)}
.go{padding:12px 16px;border-radius:11px;background:var(--star);color:var(--ink);font:700 16px var(--disp)}
.go:disabled{background:var(--panel2);color:var(--muted)}.go.wide{width:100%}
.ghost{padding:12px 16px;border-radius:11px;background:transparent;border:1px solid var(--line);font:600 15px var(--disp)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.wcard b{font:700 17px var(--disp)}.wcard small{color:var(--muted)}.wcard.on{border-color:var(--ice)}.wcard .tag{font:600 11px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
.wcard.lock{opacity:.6}
/* golden asteroid */
#gold{position:fixed;left:0;z-index:8;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF4C8,var(--ore) 45%,#9A5E12);box-shadow:0 0 24px rgba(242,184,75,.8);display:grid;place-items:center;font:700 11px var(--disp);color:var(--ink)}
#gold.fly{animation:fly 11s linear forwards}
@keyframes fly{from{transform:translateX(calc(100vw + 20px)) rotate(0)}to{transform:translateX(-90px) rotate(-540deg)}}
@media (prefers-reduced-motion:reduce){#gold.fly{animation:none;left:auto;right:20px}.row.idle .rock{animation:none}}
/* toasts + modal */
#toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:grid;gap:6px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--deep);border:1px solid var(--line);border-left:4px solid var(--ice);border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .5s,transform .5s}
.toast b{font-family:var(--disp);margin-right:4px}.toast small{display:block;color:var(--muted)}
.toast.pup{border-left-color:var(--star)}.toast.gold{border-left-color:var(--ore)}.toast.star{border-left-color:var(--star)}
.toast.out{opacity:0;transform:translateY(8px)}
#modal{position:fixed;inset:0;z-index:10;background:rgba(6,7,18,.72);display:grid;place-items:center;padding:16px}
#modalCard{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,100%);display:grid;gap:10px}
#modalCard h2{margin:0;font:700 22px var(--disp)}#modalCard p{margin:0;color:var(--muted)}#modalCard p b{color:var(--text)}
.bigstat{background:var(--panel);border-radius:12px;padding:12px;text-align:center}.bigstat span{font:700 34px var(--disp);color:var(--ore2)}.bigstat small{display:block;color:var(--muted)}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:900px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .side{position:sticky;top:176px;display:grid;gap:8px}
  #groups{grid-template-columns:1fr}
}
@media (max-width:520px){.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.tabs button{min-width:0;padding:8px 2px;font-size:12.5px;letter-spacing:0}.modes span{display:none}}
@media (max-width:420px){.row{grid-template-columns:52px minmax(0,1fr) 92px;gap:8px;padding:7px}.rock{width:52px;height:52px}.rock svg{width:38px;height:38px}.acts{width:92px}.nm{font-size:14px}.rate{display:none}}
</style>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="hud">
    <div class="world"><span id="wname">World 1 · Asteroid Belt</span><span class="snds"><button class="snd" data-export title="Copy progress code" aria-label="Copy progress code">⧉</button><button class="snd" id="musBtn" aria-pressed="false" title="Music">♪</button><button class="snd" id="sfxBtn" aria-pressed="false" title="Sounds">Fx</button></span></div>
    <div><div class="cash"><span id="cash">0</span><small id="curlbl">credits</small></div><div class="ps" id="ps">0/s</div></div>
    <div class="starchip"><b id="stars">0</b><span id="starlbl">Stars</span> <span id="starx">×1.00</span></div>
    <div class="sub"><span class="pill" id="pend"></span><span class="pill" id="boost" hidden></span><span class="pill curpill" id="curpill" hidden></span><button class="pill evpill" id="evpill" data-world="event" hidden></button><span id="timed" class="timed"></span></div>
  </header>
  <nav class="tabs" role="tablist">
    <button data-tab="earners" role="tab">Items</button><button data-tab="upgrades" role="tab">Upgrades<i class="badge" hidden></i></button>
    <button data-tab="powerups" role="tab">Power-ups<i class="badge" hidden></i></button><button data-tab="stars" role="tab"><span class="tl">Stars</span><i class="badge" hidden></i></button><button data-tab="worlds" role="tab">Worlds<i class="badge" hidden></i></button>
  </nav>
  <section class="pane" id="p-earners">
    <div class="main">
      <div class="pane">
        <div class="modes"><span>Tap an item to collect. Managers do it for you.</span><button data-mode="1" aria-pressed="true">×1</button><button data-mode="10" aria-pressed="false">×10</button><button data-mode="100" aria-pressed="false">×100</button><button data-mode="max" aria-pressed="false">Max</button><button data-mode="next" aria-pressed="false">Next</button></div>
        <div id="quick" class="quick" hidden></div><div id="earners"></div>
      </div>
      <aside class="side"><h3 id="chalHead" hidden style="margin:0;font:600 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ore)">Event challenges</h3><div id="chal" hidden></div><h3 style="margin:0;font:600 13px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ice)">Group targets</h3><div id="groups"></div></aside>
    </div>
  </section>
  <section class="pane" id="p-upgrades" hidden></section>
  <section class="pane" id="p-powerups" hidden></section>
  <section class="pane" id="p-stars" hidden></section>
  <section class="pane" id="p-worlds" hidden></section>
</div>
<button id="gold" hidden aria-label="Golden asteroid: tap for a bonus">TAP</button>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div id="modalCard" role="dialog" aria-modal="true"></div></div>
<script>
/* ===================== ECONOMY (pure: shared by the game and the pacing simulator) ===================== */
/* Main worlds stack power-ups by ADDING (steady growth). Events stack by MULTIPLYING (wild, short-lived growth). */
const ECON_MAKE=function(W){
const ADD=W.stack!=='mult';
W.starPer=W.starPer||0.02;W.msStep=W.msStep||100;W.msBeyond=W.msBeyond||1.5;
/* ---- random numbers with a saved seed, so a run's surprises survive a reload ---- */
function rng(st){st.seed=(st.seed*1664525+1013904223)>>>0;return st.seed/4294967296;}
const pct=m=>Math.round(m*100)+'%';
/* ---- power-ups drawn when a group target is reached ---- */
const PUPS=[
 {k:'all',     w:20, txt:m=>ADD?`Everything +${pct(m)}`:`Everything ×${m}`},
 {k:'tier',    w:18, txt:(m,t)=>ADD?`${W.tiers[t].name} +${pct(m)}`:`${W.tiers[t].name} ×${m}`},
 {k:'speed',   w:18, txt:(m,t)=>ADD?`${W.tiers[t].name} works ${pct(m)} faster`:`${W.tiers[t].name} works ×${m} faster`},
 {k:'grpspeed',w:8,  txt:(m,t)=>ADD?`${W.bands[t].name} items work ${pct(m)} faster`:`${W.bands[t].name} items work ×${m} faster`},
 {k:'allspeed',w:6,  txt:m=>ADD?`Everything works ${pct(m)} faster`:`Everything works ×${m} faster`},
 {k:'cost',    w:8,  txt:m=>`Everything costs ${Math.round((1-m)*100)}% less`},
 {k:'mgr',     w:6,  txt:m=>ADD?`Managed items +${pct(m)}`:`Managed items ×${m}`},
 {k:'tx',      w:6,  txt:(m,t,d)=>`Everything ×${m} for ${d/60000} minutes`},
 {k:'ttier',   w:5,  txt:(m,t,d)=>`${W.tiers[t].name} ×${m} for ${d/60000} minutes`},

  return W.bands.map((B,b)=>ok(B.tiers)?groupLine(B.name,st.bandIdx[b],st.bandT[b],B.tiers):'').join('')+(ok(all)?groupLine('Full set',st.fullIdx,st.fullT,all):'');}

function renderUps(){const list=E.UPS.filter(u=>!st.ups[u.id]&&(u.t<0||E.allowed(st,u.t))).slice(0,10);const owned=E.UPS.filter(u=>st.ups[u.id]).length;
  $('#p-upgrades').innerHTML=`<p class="lead">One-off boosts for this run. ${owned} bought.</p>`+((st.perks.quick||0)>=1?`<button class="go wide" data-quick="ups" ${E.quickCan(st).ups?'':'disabled'}>Buy all upgrades I can afford</button>`:'')+list.map(u=>{const c=E.upPrice(st,u);const lock=u.t>=0&&!st.tiers[u.t].n;
    return `<div class="card"><div><b>${esc(u.txt)}</b><small>${u.t<0?'Every item':lock?'Own one first':'One item'}</small></div><button class="buy" data-up="${u.id}" ${c>st.cash||lock?'disabled':''}><small>Buy</small><b>${fmt(c)}</b></button></div>`;}).join('');}
function aggHTML(){const g={};const M=!E.ADD;const add=(key,label,m,mul)=>{mul=mul||M;g[key]=g[key]||{label,v:mul?1:0,n:0,mul};g[key].v=mul?g[key].v*m:g[key].v+m;g[key].n++;};
  st.pups.forEach(p=>{switch(p.k){case 'all':add('all','Everything',p.m);break;case 'tier':add('t'+p.t,W.tiers[p.t].name,p.m);break;
    case 'speed':add('s'+p.t,W.tiers[p.t].name+' speed',p.m);break;case 'grpspeed':add('g'+p.t,W.bands[p.t].name+' items speed',p.m);break;
    case 'allspeed':add('as','Everything speed',p.m);break;case 'cost':add('c','Prices',p.m,1);break;case 'mgr':add('m','Managed items',p.m);break;}});
  const val=x=>x.label==='Prices'?'−'+Math.round((1-x.v)*100)+'%':x.mul?'×'+(+x.v.toFixed(2)):'+'+Math.round(x.v*100)+'%';
  const rows=Object.values(g).map(x=>`<div class="card pupc"><div><b>${esc(x.label)} ${val(x)}</b><small>from ${x.n} pick${x.n>1?'s':''}${!x.mul&&x.label!=='Prices'?' · power-ups of the same kind add together':''}</small></div></div>`);
  (st.timed||[]).forEach(x=>rows.unshift(`<div class="card pupc timedc"><div><b>${esc(x.txt.replace(/ for \d+ minutes$/,''))}</b><small>${fmtT(x.left/1000)} left · only counts while you're playing</small></div></div>`));
  return rows.join('');}
function picksHTML(){const pk=st.picks||[];if(!pk.length)return '';const t=now();
  return `<h3>Choose a power-up (${pk.length})</h3>`+pk.map((q,qi)=>`<div class="pick"><div class="pickh"><b>${esc(q.src)}</b><small>Auto-picks in ${fmtT(Math.max(0,(q.at+180000-t)/1000))}</small></div><div class="opts">${q.opts.map((o,c)=>`<button class="opt" data-pick="${qi}:${c}">${esc(o.txt)}</button>`).join('')}</div></div>`).join('');}
function renderPups(){const P=st.pups;
  $('#p-powerups').innerHTML=`<p class="lead">Get every item in a group to the target count and you choose 1 of ${st.perks.choice4?4:3} random power-ups. Targets climb faster each time, and they shift a little every run.</p>
   ${picksHTML()}<div id="groups2">${groupsHTML()}</div>
   <h3>Active this run (${P.length} picked)</h3>${P.length||(st.timed||[]).length?aggHTML():'<p class="muted">None yet. The first one usually drops within a few minutes.</p>'}`;}
function chalHTML(){if(P.cur!=='event')return '';return P.ev.chal.map(c=>{const v=Math.max(0,chalValue(c));const pct=Math.min(100,v/c.need*100);
  return `<div class="grp chal"><b>${esc(chalText(c))}</b><span>+${c.tok} tokens</span><span class="gp"><i style="width:${pct}%"></i></span><span class="gc">${Math.floor(pct)}%</span></div>`;}).join('');}
function renderChal(){const el=$('#chal');el.hidden=P.cur!=='event';$('#chalHead').hidden=P.cur!=='event';if(P.cur==='event')el.innerHTML=chalHTML();}
function renderEvent(){const tw=TWISTS.find(x=>x.id===P.ev.tw);const a=E.advice(st);
  $('#p-stars').innerHTML=`<div class="starbox"><div><span class="big">${P.ev.tok}</span><small>tokens this event</small></div><div><span class="big">+${P.tok}%</span><small>bonus kept from past events</small></div></div>
   <div class="advice lv1"><b>${esc(tw.name)}</b><span>${esc(tw.txt)} Ends in ${fmtT((P.ev.end-now())/1000)}.</span></div>
   <p class="lead">Challenges appear three at a time. Finish one and a harder one takes its place. When the event ends, every token becomes +1% earnings in every world, for good.</p>
   <h3>Challenges</h3>${chalHTML()}<p class="muted small">${P.ev.done} challenge${P.ev.done===1?'':'s'} finished so far.</p>
   <h3>Event Stars</h3><p class="lead">Stuck? Restart the event to bank Event Stars. Each adds 2% to event earnings, for this event only. Tokens and finished challenges are kept.</p>
   <div class="advice lv${a.level}"><b>${esc(a.text.replace('Stars','Event Stars'))}</b>${a.p?`<span>Restarting now: ×${a.a.toFixed(2)} → ×${a.b.toFixed(2)} (+${Math.round(a.gain*100)}%)</span>`:''}</div>
   <button class="go wide" id="restartBtn" ${a.p?'':'disabled'}>Restart for ${a.p} Event Stars</button><p class="muted small">Event Stars: ${st.stars} (×${E.starMult(st).toFixed(2)}). Event restarts: ${st.runs}. An event gives at most ${TOK_CAP} tokens.</p>
   <button class="ghost wide" data-export>Copy progress code</button>`;}
function renderWorlds(){const w=eventWindow(now());const bs=P.w.belt.starsEver||0,cs=P.w.coffee?P.w.coffee.starsEver||0:0;const card=(id,name,tag,txt,on,lock,btn)=>`<div class="wcard${on?' on':''}${lock?' lock':''}"><span class="tag">${tag}</span><b>${esc(name)}</b><small>${txt}</small>${btn?`<button class="ghost small" data-world="${id}">${btn}</button>`:''}</div>`;
  const tw=P.ev?TWISTS.find(x=>x.id===P.ev.tw):twistFor(eventWindow(w.next).id);
  const wc=(id,num,short)=>{const X=ECONS[id].W,on=unlocked(id),u=UNLOCK[id];return card(id,X.name,P.cur===id?'Playing':on?'World '+num:'Locked',esc(X.blurb)+(on?'':` Unlocks when ${esc(ECONS[u.from].W.name)} reaches ${u.need} ${esc(ECONS[u.from].W.starName)} (${fmt(u.from==='belt'?bs:cs)}/${u.need}).`),P.cur===id,!on,on&&P.cur!==id?(P.w[id]?'Go to '+short:'Open '+X.name):'');};
  $('#p-worlds').innerHTML=`<p class="lead">Each world plays at its own speed with its own twist. ${esc(ECONS.belt.W.starName)}, Beans and Relics from your other worlds give a small bonus that grows slowly (×${sharedMult(P.cur).toFixed(2)} here now), and event tokens add 1% each to every world.</p><div class="worlds">
   ${card('belt','Asteroid Belt',P.cur==='belt'?'Playing':'World 1',esc(ECONS.belt.W.blurb),P.cur==='belt',false,P.cur==='belt'?'':'Go to the Belt')}
   ${wc('coffee',2,'Coffee')}${wc('salvage',3,'the Deep Sea')}
   ${!eventsOpen()?card('','Weekly events','Locked','Short, wild events every Friday to Monday. Unlock by restarting the Belt once.',false,true,''):P.ev?card('event','Weekly event: '+tw.name,P.cur==='event'?'Playing':'Live now',esc(tw.txt)+` Ends in ${fmtT((P.ev.end-now())/1000)}.`,P.cur==='event',false,P.cur==='event'?'':'Play the event'):card('','Next event: '+tw.name,'Opens Friday',`${esc(tw.txt)} Starts in ${fmtT((w.next-now())/1000)} and runs for 4 days.`,false,true,'')}
   ${card('','Wizard\'s Tower','Coming later','Stack spells with cooldowns so they multiply.',false,true,'')}
  </div>${P.evBadges.length?`<h3>Event badges</h3><div class="evb">${P.evBadges.slice(-12).reverse().map(b=>`<span>${esc(b.name)} · ${b.tok} tokens</span>`).join('')}</div>`:''}`;}
const PERK_TIP={keepMgr:'best if you restart often',head:'speeds up the first minutes',startPup:'a free random power-up each run',luck:'more bursts if you play actively',goldLen:'bigger bursts for active play',msBoost:'every item earns more as it grows',choice4:'more say over your power-ups',quick:'fewer taps, you still choose when'};
function renderStars(){const p=E.pendingStars(st);
  const a=E.advice(st),SN=W.starName;
  $('#p-stars').innerHTML=`<div class="starbox"><div><span class="big">${st.stars}</span><small>${SN} · each adds 2% to ${esc(W.name)} earnings</small></div><div><span class="big">+${p}</span><small>ready from this run</small></div></div>
   <div class="advice lv${a.level}"><b>${esc(a.text)}</b>${a.p?`<span>Restarting now: ×${a.a.toFixed(2)} → ×${a.b.toFixed(2)} (+${Math.round(a.gain*100)}%)</span>`:''}</div>
   <p class="lead">${SN} come from everything you've ever earned in ${esc(W.name)}, so every run adds some and a big run adds more. Next ${W.unit} in ${fmt(E.nextStarAt(st))} ${W.cur}. The advice says "Good time" once the boost is big (double on your first restart, then +40%, easing to +12% as you restart more) and ${SN} have stopped piling up quickly.</p>
   <button class="go wide" id="restartBtn" ${p?'':'disabled'}>Restart for ${p} ${SN}</button>
   <h3>Perks</h3><p class="muted">Perks cost ${SN}, and spent ${SN} stop adding their 2%. Pick the ones that suit how you play.</p>`+
   E.PERKS.map(pk=>{const l=st.perks[pk.id]||0;const im=E.perkImpact(st,pk);const c=im&&im.c;const risky=im&&im.drop>0.2&&c<=st.stars;
     const impact=im?(c>st.stars?`<small>Needs ${c} ${W.starName}</small>`:`<small class="${risky?'warn':''}">Bonus ×${im.a.toFixed(2)} → ×${im.b.toFixed(2)} (−${Math.round(im.drop*100)}%)</small>`):'';
     return `<div class="card"><div><b>${esc(pk.txt(Math.min(pk.max,l+(l<pk.max?1:0))))}</b><small>Level ${l}/${pk.max} · ${PERK_TIP[pk.id]}</small>${impact}</div>${c==null?'<span class="maxed">Maxed</span>':`<button class="buy${risky?' risky':''}" data-perk="${pk.id}" ${c>st.stars?'disabled':''}><small>${risky?'Big cut':'Buy'}</small><b>${c} ★</b></button>`}</div>`;}).join('')+
   `<p class="muted small">Runs so far: ${st.runs}. Best run: ${fmt(st.best||0)} ${W.cur}. Lifetime: ${fmt(st.total)} ${W.cur}. Shared bonus from other worlds and events: ×${sharedMult(P.cur).toFixed(2)}. Version ${VERSION}.</p>
   <button class="ghost wide" data-export>Copy progress code</button><p class="muted small">Paste the code to Claude for a check-up on how your game is going.</p>`;}
function progressCode(){const w={};const r3=v=>+(+v||0).toPrecision(3);
  worldIds().forEach(id=>{const S=stateOf(id),X=econOf(id);w[id]={stars:S.stars,ever:S.starsEver,runs:S.runs,best:r3(S.best),life:r3(S.life),run:r3(S.runEarned),runMin:Math.round((now()-(S.runStart||now()))/60000),
    cash:r3(S.cash),ps:r3(X.incomeAll(S)),n:S.tiers.map(T=>T.n),mgr:S.tiers.map(T=>T.mgr?1:0).join(''),ups:Object.keys(S.ups).length,pups:S.pups.map(p=>p.k+(p.t!=null?p.t:'')+'x'+p.m).join(' '),
    timed:(S.timed||[]).length,picks:(S.picks||[]).length,perks:S.perks,pend:X.pendingStars(S),grp:[S.bandIdx,S.fullIdx],mod:S.mod||null};});
  return 'Asteroid Belt Idle progress '+JSON.stringify({v:VERSION,at:new Date().toISOString(),cur:P.cur,tok:P.tok,badges:P.evBadges.length,w,
    ev:P.ev?{tw:P.ev.tw,tok:P.ev.tok,done:P.ev.done,chal:P.ev.chal.map(c=>chalText(c)+' '+Math.floor(Math.min(1,Math.max(0,chalValue(c))/c.need)*100)+'%')}:null});}
/* ---- golden asteroid ---- */
function goldCheck(){const g=$('#gold');const t=now();if(!g.hidden)return;if(t>=st.nextGold){g.hidden=false;const y=12+Math.random()*60;g.style.top=y+'%';g.classList.remove('fly');void g.offsetWidth;g.classList.add('fly');
  setTimeout(()=>{if(!g.hidden){g.hidden=true;st.nextGold=now()+E.goldGap(st);}},11000);}}
/* ---- starfield ---- */
function stars(){const c=$('#sky');const dpr=Math.min(2,devicePixelRatio||1);const w=c.width=innerWidth*dpr,h=c.height=innerHeight*dpr;const x=c.getContext('2d');
  const pts=Array.from({length:120},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()}));const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function f(){x.clearRect(0,0,w,h);pts.forEach(p=>{if(!reduce){p.x-=(0.05+p.z*0.25)*dpr;if(p.x<0)p.x=w;}x.fillStyle=`rgba(237,235,255,${0.25+p.z*0.6})`;const s=(p.z>0.85?2:1)*dpr;x.fillRect(p.x,p.y,s,s);});requestAnimationFrame(f);})();}
/* ---- loop ---- */
let last=now(),saveT=0;
let evT=0;
function loop(){const t=now();let dt=(t-last)/1000;last=t;
  evT+=dt;if(evT>10){evT=0;const had=!!P.ev;eventCheck();if(!had&&P.ev)toast(`<b>Weekly event is live</b> ${esc(TWISTS.find(x=>x.id===P.ev.tw).name)}. Find it on the Worlds tab.`,'star');}
  if(dt>5){const r=redeem(P.cur);if(r&&r.gap>30000)welcome(r);dt=0;}
  st.xm=sharedMult(P.cur);E.tick(st,dt,t);E.autoBuy(st);E.noteStars(st);E.autoPick(st).forEach(p=>toast(`<b>Power-up picked for you</b> ${esc(p.txt)}`,'pup'));st.seen=t;
  checkChal();checkUnlocks();goldCheck();render();saveT+=dt;if(saveT>5){saveT=0;save();}}
AUDIO.world(P.cur);AUDIO.set('sfx',P.audio.sfx);if(P.audio.music)AUDIO.set('music',true);audioBtns();
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>AUDIO.wake(),{once:false,passive:true}));
buildEarners();labels();stars();setTab('earners');
function sticky(){const h=$('.hud').offsetHeight,tb=$('.tabs').offsetHeight;document.documentElement.style.setProperty('--hudH',h+'px');document.documentElement.style.setProperty('--tabH',tb+'px');}
sticky();addEventListener('resize',sticky);setInterval(sticky,1500);
setInterval(loop,100);
let hiddenAt=0;
function welcome(r){const others=worldIds().filter(id=>id!==r.id).length;
  openModal(`<h2>Welcome back</h2><p>${esc(r.name[0].toUpperCase()+r.name.slice(1))} kept working for <b>${fmtT(r.gap/1000)}</b>.</p>${r.v>0?`<div class="bigstat"><span>+${fmt(r.v)}</span><small>${esc(r.cur)}</small></div>`:'<p class="muted">Hire managers so items keep working while you\'re away.</p>'}${others?'<p class="muted small">Your other worlds are saving up too. Collect when you visit them.</p>':''}<div class="mact"><button class="go" id="awayOk">Collect</button></div>`);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=now();AUDIO.sleep();save();}else if(hiddenAt){const gap=now()-hiddenAt;hiddenAt=0;
  AUDIO.wake();if(gap>2000){const r=redeem(P.cur);last=now();if(r&&r.gap>30000)welcome(r);render(true);save();}}});addEventListener('pagehide',save);
if(P.season){P.season=false;save();openModal(`<h2>A fresh start</h2><p>Asteroid Belt Idle has been rebalanced, so everyone starts again from the first Pickaxe Bot.</p><ul class="muted"><li>The Belt grows steadily: restarts pay off every time, without running away.</li><li>Items never max out. After each item's milestone list, a new milestone comes every +100.</li><li>Unlock Coffee Empire at 500 Stars, then the new Deep-Sea Salvage at 500 Beans.</li><li>Weekly events unlock after your first restart, and they're the wild ones.</li><li>Star perks have many more levels. Each costs more than the last, so Stars always have a use.</li></ul><p>Everything starts from zero, including the event bonus and badges. Only your sound settings are kept.</p><div class="mact"><button class="go" id="awayOk">Let's go</button></div>`);}
else if(awayMsg)welcome(awayMsg);
window.__belt={st:()=>st,E:()=>E,P:()=>P,save,switchWorld,eventCheck,finishEvent};
})();

</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});});}</script></body></html>
